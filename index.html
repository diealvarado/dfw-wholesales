<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=ai-legible&utm_source=comment&utm_medium=referral&utm_id=555c5d1d-112e-459d-8fe1-de859d24708f
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
<meta name="hosting-provider" content="Netlify">
<meta name="netlify-deploy" content="https://netlify.new/?utm_campaign=ai-legible&amp;utm_source=meta&amp;utm_medium=referral&amp;utm_id=555c5d1d-112e-459d-8fe1-de859d24708f">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesale Properties Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
        #map-container { height: 100vh; width: 100vw; z-index: 1; }
        .overlay-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .spinner {
            display: inline-block;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="overlay-box">
        <h1 class="text-xl font-bold text-slate-900 mb-1">Recent Deals (Last 10 Days)</h1>

        <div class="flex flex-wrap items-center justify-center gap-2 mb-2">
            <button onclick="toggleViewMode()" id="view-toggle-btn" class="text-xs bg-blue-600 text-white font-semibold px-3 py-1.5 rounded-lg hover:bg-blue-700 transition">
                Switch to List View 📄
            </button>

            <span id="filter-badge" class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded">Mode: Target DFW Area</span>
            <button onclick="toggleFilterMode()" id="filter-toggle-btn" class="text-xs bg-slate-900 text-white font-semibold px-3 py-1.5 rounded-lg hover:bg-slate-800 transition">
                Show All Cities
            </button>
        </div>

        <p id="status-text" class="text-sm text-slate-600 font-medium">
            <span class="spinner"></span> Loading property data...
        </p>
    </div>

    <div id="map-container"></div>

    <div id="list-container" class="hidden max-w-7xl mx-auto px-4 pt-36 pb-20 z-10 relative">
        <div id="property-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSEqr1ov1Iqat1Ep3KSvFn1vbM8Ti-rRT9fhZOiPOGvkHnKi6Aub8RcJ5BZCOfLN_uKk8seu5bZfx2u/pub?gid=0&single=true&output=csv';

        let map, markerGroup;
        let cachedRawData = [];
        let showAllAreas = false;
        let isListView = false;
        let currentRunId = 0;

        function toggleViewMode() {
            isListView = !isListView;
            const viewBtn = document.getElementById('view-toggle-btn');
            const mapContainer = document.getElementById('map-container');
            const listContainer = document.getElementById('list-container');

            if (isListView) {
                viewBtn.innerText = "Switch to Map View 🗺️";
                mapContainer.classList.add('hidden');
                listContainer.classList.remove('hidden');
            } else {
                viewBtn.innerText = "Switch to List View 📄";
                listContainer.classList.add('hidden');
                mapContainer.classList.remove('hidden');
                if (map) {
                    setTimeout(() => map.invalidateSize(), 0);
                }
            }
        }

        // Expanded Target DFW allowlist (2026-09): includes major DFW cities previously omitted (Dallas, Fort Worth, Arlington, etc.)
        const allowedCities = [
            "Dallas", "Fort Worth", "Ft Worth", "Ft. Worth", "Arlington",
            "Plano", "Irving", "Garland", "Grand Prairie", "McKinney", "Frisco",
            "Denton", "Richardson", "Carrollton", "Mesquite", "Lewisville", "Allen",
            "Flower Mound", "Mansfield", "North Richland Hills", "N. Richland Hills",
            "Euless", "Bedford", "Grapevine", "Keller", "Southlake", "Coppell",
            "Rowlett", "Wylie", "Burleson", "Cedar Hill", "DeSoto", "Desoto",
            "Duncanville", "Haltom City", "Hurst", "The Colony", "Little Elm",
            "Prosper", "Rockwall", "Weatherford", "Cleburne", "Waxahachie", "Midlothian",
            "Argyle", "Lantana", "Double Oak", "Bartonville", "Watauga",
            "Highland Village", "Roanoke", "Trophy Club"
        ];

        const normalizeCity = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
        const allowedCitySet = new Set(allowedCities.map(normalizeCity));

        function parseSheetDate(raw) {
            if (!raw) return null;
            const d = new Date(raw);
            if (!isNaN(d.getTime())) return d;
            const m = String(raw).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
            if (!m) return null;
            const year = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
            return new Date(year, Number(m[1]) - 1, Number(m[2]));
        }

        function findKey(keys, aliases) {
            const cleaned = keys.map(k => ({
                raw: k,
                norm: k.replace(/[^a-zA-Z]/g, '').toLowerCase()
            }));
            for (const alias of aliases) {
                const hit = cleaned.find(c => c.norm === alias);
                if (hit) return hit.raw;
            }
            return undefined;
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        function toggleFilterMode() {
            showAllAreas = !showAllAreas;
            const btn = document.getElementById('filter-toggle-btn');
            const badge = document.getElementById('filter-badge');

            if (showAllAreas) {
                btn.innerText = "Show Target DFW Only";
                badge.innerText = "Mode: All Cities (Last 10 Days)";
                badge.className = "text-xs bg-amber-100 text-amber-800 font-semibold px-2.5 py-1 rounded";
            } else {
                btn.innerText = "Show All Cities";
                badge.innerText = "Mode: Target DFW Area";
                badge.className = "text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded";
            }

            processProperties();
        }

        function initMap() {
            map = L.map('map-container').setView([32.7767, -96.7970], 9);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            markerGroup = L.layerGroup().addTo(map);
            fetchData();
        }

        function fetchData() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: (results) => {
                    cachedRawData = results.data;
                    processProperties();
                },
                error: (error) => {
                    document.getElementById('status-text').innerHTML = `<span class="text-red-500">Error loading data: ${error.message}</span>`;
                }
            });
        }

        async function processProperties() {
            const runId = ++currentRunId;
            const data = cachedRawData;
            if (!data || data.length === 0) {
                document.getElementById('status-text').innerHTML = `<span class="text-red-600 font-bold">Error: The CSV file is completely empty.</span>`;
                return;
            }

            const sampleRow = data[0];
            const keys = Object.keys(sampleRow);
            const addressKey = findKey(keys, ['address']);
            const dateKey    = findKey(keys, ['emaildate', 'date']);
            const cityKey    = findKey(keys, ['city']);
            const zipKey     = findKey(keys, ['zipcode', 'zip']);
            const priceKey   = findKey(keys, ['price']);
            const senderKey  = findKey(keys, ['sender']);

            if (!addressKey) {
                document.getElementById('status-text').innerHTML = `
                    <div class="text-red-600 text-sm mt-2 text-left bg-red-50 p-3 border border-red-200 rounded">
                        <strong>Could not find 'Address' column!</strong><br>
                        <strong>Detected Headers in CSV:</strong> ${keys.join(" | ")}
                    </div>`;
                return;
            }

            const tenDaysAgo = new Date();
            tenDaysAgo.setDate(tenDaysAgo.getDate() - 10);
            tenDaysAgo.setHours(0, 0, 0, 0);

            const validProperties = [];

            for (const rawRow of data) {
                const address = rawRow[addressKey] ? String(rawRow[addressKey]).trim() : '';
                const city = cityKey && rawRow[cityKey] ? String(rawRow[cityKey]).trim() : '';
                const rawDate = dateKey ? rawRow[dateKey] : '';
                const emailDate = parseSheetDate(rawDate);

                if (!address || address === '' || address.toUpperCase() === 'N/A') continue;
                if (dateKey && (!emailDate || emailDate < tenDaysAgo)) continue;

                if (!showAllAreas) {
                    const zip = zipKey && rawRow[zipKey] ? String(rawRow[zipKey]).trim() : '';
                    const cityOk = allowedCitySet.has(normalizeCity(city));
                    const zipOk = /^(75|76)\d{3}\b/.test(zip);
                    if (!cityOk && !zipOk) continue;
                }

                validProperties.push({
                    'Address': address,
                    'City': city,
                    'Zip Code': zipKey && rawRow[zipKey] ? String(rawRow[zipKey]).trim() : '',
                    'Price': priceKey && rawRow[priceKey] ? String(rawRow[priceKey]).trim() : 'Contact for Price',
                    'Email Date': rawDate,
                    'Sender': senderKey && rawRow[senderKey] ? String(rawRow[senderKey]).trim() : 'Unknown Sender'
                });
            }

            if (validProperties.length === 0) {
                markerGroup.clearLayers();
                renderListView([]);
                document.getElementById('status-text').innerHTML = `
                    <div class="text-red-600 text-sm mt-2 text-left bg-red-50 p-3 border border-red-200 rounded">
                        <strong>0 properties passed the filter. Debug Info:</strong><br>
                        1. <strong>Matched Address Header:</strong> '${addressKey}'<br>
                        2. <strong>Matched Date Header:</strong> '${dateKey}'<br>
                        3. <strong>Sample Address Value:</strong> '${sampleRow[addressKey]}'<br>
                        4. <strong>Sample Date Value:</strong> '${sampleRow[dateKey]}'
                    </div>`;
                return;
            }

            if (runId !== currentRunId) return;

            document.getElementById('status-text').innerHTML =
                `<span class="spinner"></span> Mapping ${validProperties.length} properties...`;

            await mapProperties(validProperties, runId);
            if (runId !== currentRunId) return;

            renderListView(validProperties);
            document.getElementById('status-text').innerText =
                `${validProperties.length} properties mapped successfully.`;
        }

        async function mapProperties(properties, runId) {
            markerGroup.clearLayers();
            const bounds = [];
            const total = properties.length;

            for (let i = 0; i < properties.length; i++) {
                if (runId !== currentRunId) return;

                const prop = properties[i];
                document.getElementById('status-text').innerHTML =
                    `<span class="spinner"></span> Mapping ${i + 1} / ${total}...`;

                const address = prop['Address'];
                const city = prop['City'] !== 'N/A' && prop['City'] ? prop['City'].trim() : '';
                const zipCode = prop['Zip Code'] && prop['Zip Code'] !== 'N/A'
                    ? String(prop['Zip Code']).trim()
                    : '';
                const price = prop['Price'] !== 'N/A' && prop['Price'] ? prop['Price'] : 'Contact for Price';

                const dateObj = parseSheetDate(prop['Email Date']);
                const formattedDate = dateObj ? dateObj.toLocaleDateString() : (prop['Email Date'] || '');
                const displayAddress = `${address}${city ? ', ' + city : ''}${zipCode ? ' ' + zipCode : ''}`;

                let searchQuery = address;
                if (city) searchQuery += `, ${city}`;
                if (zipCode) searchQuery += ` ${zipCode}`;
                if (!city && !zipCode) {
                    searchQuery += `, Dallas-Fort Worth, TX`;
                } else {
                    searchQuery += `, TX`;
                }

                let lat, lon;
                try {
                    const cached = localStorage.getItem('geo_' + searchQuery);
                    if (cached) {
                        const c = JSON.parse(cached);
                        lat = c.lat;
                        lon = c.lon;
                    }
                } catch (e) {}

                if (!lat || !lon) {
                    try {
                        const params = new URLSearchParams({
                            format: 'json',
                            q: searchQuery,
                            countrycodes: 'us',
                            limit: '1',
                            email: 'wholesale-map@local'
                        });
                        const resp = await fetch(
                            `https://nominatim.openstreetmap.org/search?${params.toString()}`,
                            { headers: { 'Accept': 'application/json' } }
                        );
                        const data = await resp.json();

                        if (data.length > 0) {
                            lat = data[0].lat;
                            lon = data[0].lon;
                            localStorage.setItem('geo_' + searchQuery, JSON.stringify({ lat, lon }));
                        }

                        await sleep(1000);
                    } catch (e) {
                        console.error("Geocoding failed for:", searchQuery);
                    }
                }

                if (lat && lon) {
                    const sender = prop['Sender'];
                    const popupContent = `
                        <div class="text-sm">
                            <strong class="text-base text-slate-800">${displayAddress}</strong><br>
                            <span class="text-blue-600 font-bold mt-1 block">Price: ${price}</span>
                            <span class="text-slate-700 text-xs block"><strong>Sender:</strong> ${sender}</span>
                            <span class="text-slate-500 text-xs">Email Date: ${formattedDate}</span>
                        </div>
                    `;
                    const marker = L.marker([lat, lon]).bindPopup(popupContent);
                    markerGroup.addLayer(marker);
                    bounds.push([lat, lon]);
                }
            }

            if (runId !== currentRunId) return;
            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [40, 40] });
            }
        }

        function renderListView(properties) {
            const grid = document.getElementById('property-grid');

            if (properties.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-slate-500 py-10 font-medium">No properties found matching your filter criteria.</div>`;
                return;
            }

            const cards = properties.map(prop => {
                const address = prop['Address'];
                const city = prop['City'];
                const zipCode = prop['Zip Code'];
                const price = prop['Price'];
                const sender = prop['Sender'];
                const dateObj = parseSheetDate(prop['Email Date']);
                const formattedDate = dateObj ? dateObj.toLocaleDateString() : (prop['Email Date'] || '');
                const displayAddress = `${address}${city ? ', ' + city : ''}${zipCode ? ' ' + zipCode : ''}`;
                const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(displayAddress)}`;

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <h3 class="font-bold text-slate-900 text-lg leading-snug">${displayAddress}</h3>
                                <span class="text-blue-700 font-extrabold text-base bg-blue-50 px-2.5 py-1 rounded-lg ml-2 whitespace-nowrap">${price}</span>
                            </div>
                            <div class="space-y-1.5 text-sm text-slate-600 mb-4 border-t border-slate-100 pt-3">
                                <div>🏢 <strong>Sender:</strong> <span class="text-slate-800">${sender}</span></div>
                                <div>📅 <strong>Email Date:</strong> ${formattedDate}</div>
                            </div>
                        </div>
                        <div class="pt-2 border-t border-slate-100">
                            <a href="${googleMapsUrl}" target="_blank"
                               class="block text-center text-xs font-bold py-2.5 px-4 border border-emerald-200 text-emerald-700 rounded-xl bg-emerald-50 hover:bg-emerald-100 transition">
                                Open in Google Maps 🗺️
                            </a>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = cards.join('');
        }

        window.onload = initMap;
    </script>
</body>
</html>
