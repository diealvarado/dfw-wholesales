<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alvacom Homes · Off-Market</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="description" content="Alvacom Homes — curated off-market investment properties across DFW." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 50:'#f5f7fa', 100:'#e8eef5', 600:'#1e3a5f', 700:'#16304f', 800:'#0f243c', 900:'#0a1624' },
            gold: { 400:'#d4b44a', 500:'#c9a227', 600:'#a8861c' }
          },
          fontFamily: {
            display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { height:100%; margin:0; font-family:'DM Sans', system-ui, sans-serif; background:#f5f7fa; color:#0f243c; }
    #map { height:100%; width:100%; }
    .spin { display:inline-block; width:12px; height:12px; border:2px solid #d5deea; border-top-color:#1e3a5f; border-radius:50%; animation:spin .75s linear infinite; vertical-align:-1px; margin-right:6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .marker-unavail { filter: grayscale(1) opacity(0.55); }
    .card-unavail { opacity: 0.72; background: #f1f5f9 !important; }
    @media print {
      body * { visibility: hidden !important; }
      #sheet, #sheet * { visibility: visible !important; }
      #sheet { position:absolute; left:0; top:0; width:100%; max-height:none !important; overflow:visible !important; box-shadow:none !important; border:none !important; }
      .no-print { display:none !important; }
    }
  </style>
</head>
<body class="h-full overflow-hidden">
  <div id="loginOverlay" class="hidden fixed inset-0 z-[2000] flex items-center justify-center bg-ink-900/70 backdrop-blur-sm px-4">
    <form id="loginForm" class="w-full max-w-sm rounded-2xl bg-white shadow-2xl border border-slate-200 p-6">
      <div class="font-display text-2xl font-semibold text-ink-700">Alvacom Homes</div>
      <div class="text-[10px] uppercase tracking-[0.22em] text-slate-400 mt-0.5 mb-4">Off-Market · Private access</div>
      <label class="block text-xs font-semibold text-slate-500 mb-1.5" for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required
        class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-ink-600/30 focus:border-ink-600" />
      <p id="loginError" class="hidden mt-2 text-xs text-red-600"></p>
      <button type="submit" id="loginBtn"
        class="mt-4 w-full text-sm font-semibold px-4 py-2.5 rounded-xl bg-ink-700 text-white hover:bg-ink-600 transition">Sign in</button>
    </form>
  </div>

  <header class="fixed top-0 inset-x-0 z-[1100] border-b border-slate-200/80 bg-white/95 backdrop-blur">
    <div class="mx-auto max-w-[1400px] px-4 sm:px-6 py-3 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
      <div class="min-w-0 flex items-center justify-between gap-3">
        <div>
          <div class="font-display text-2xl sm:text-3xl font-semibold tracking-tight text-ink-700 leading-none">Alvacom Homes</div>
          <div class="mt-0.5 text-[10px] sm:text-[11px] font-medium uppercase tracking-[0.22em] text-slate-400">Off-Market</div>
        </div>
      </div>
      <div class="flex flex-wrap items-center justify-end gap-2">
        <label class="relative flex-1 sm:flex-none min-w-[10rem] max-w-xs">
          <span class="sr-only">Search city or ZIP</span>
          <input id="searchInput" type="search" placeholder="Search city or ZIP…"
            class="w-full sm:w-44 text-xs font-medium px-3 py-2 rounded-lg border border-slate-200 bg-white text-ink-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-ink-600/25 focus:border-ink-600" />
        </label>
        <span id="badge" class="hidden sm:inline-flex text-[11px] font-semibold px-2.5 py-1 rounded-full bg-ink-100 text-ink-700">Target suburbs</span>
        <button id="btnFilter" type="button" class="text-xs font-semibold px-3 py-2 rounded-lg bg-ink-700 text-white hover:bg-ink-600 transition">Show all cities</button>
        <button id="btnMyCities" type="button" class="hidden text-xs font-semibold px-3 py-2 rounded-lg border border-slate-200 bg-white text-ink-700 hover:bg-slate-50 transition">My cities</button>
        <button id="btnView" type="button" class="text-xs font-semibold px-3 py-2 rounded-lg border border-slate-200 bg-white text-ink-700 hover:bg-slate-50 transition">List view</button>
        <button id="btnLogout" type="button" class="hidden text-xs font-semibold px-3 py-2 rounded-lg border border-slate-200 bg-white text-slate-500 hover:bg-slate-50 transition">Sign out</button>
      </div>
    </div>
    <div class="border-t border-slate-100 bg-ink-50/90 px-4 sm:px-6 py-1.5">
      <p id="status" class="mx-auto max-w-[1400px] text-xs text-slate-500"><span class="spin"></span>Loading listings…</p>
    </div>
  </header>

  <main class="h-full pt-[104px] sm:pt-[88px] relative">
    <div id="map"></div>
    <div id="list" class="hidden absolute inset-0 overflow-y-auto bg-ink-50 z-[1000]">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 py-6">
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
      </div>
    </div>
  </main>

  <div id="backdrop" class="hidden fixed inset-0 z-[1200] bg-ink-900/40 backdrop-blur-[2px] no-print"></div>
  <aside id="sheet" class="hidden fixed inset-y-0 right-0 z-[1201] w-full max-w-xl overflow-y-auto bg-white shadow-2xl border-l border-slate-200">
    <div class="sticky top-0 z-10 flex items-center justify-between gap-3 border-b border-slate-100 bg-white/95 px-5 py-3 backdrop-blur no-print">
      <div>
        <div class="font-display text-lg font-semibold text-ink-700">Property brief</div>
        <div class="text-[10px] uppercase tracking-[0.18em] text-slate-400">Alvacom Homes · Off-Market</div>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnPrint" type="button" class="text-xs font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50">Print / PDF</button>
        <button id="btnClose" type="button" class="text-xs font-semibold px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200">Close</button>
      </div>
    </div>
    <div id="sheetBody" class="px-5 py-5"></div>
  </aside>

  <div id="filterModal" class="hidden fixed inset-0 z-[2100] flex items-end sm:items-center justify-center bg-ink-900/50 px-4 py-6">
    <div class="w-full max-w-lg rounded-2xl bg-white shadow-2xl border border-slate-200 overflow-hidden" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
        <div>
          <div id="filterTitle" class="font-display text-lg font-semibold text-ink-700">My city filter</div>
          <div class="text-xs text-slate-500">Pick any DFW cities to show. Saved on this device only.</div>
        </div>
        <button type="button" id="btnFilterClose" class="text-xs font-semibold px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200">Close</button>
      </div>
      <div class="px-5 py-3 max-h-[50vh] overflow-y-auto">
        <div id="cityChips" class="grid grid-cols-2 gap-2 text-sm"></div>
      </div>
      <div class="px-5 py-4 border-t border-slate-100 flex flex-wrap gap-2 justify-between">
        <button type="button" id="btnFilterReset" class="text-xs font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50">All DFW cities</button>
        <button type="button" id="btnFilterSave" class="text-xs font-semibold px-4 py-2 rounded-lg bg-ink-700 text-white hover:bg-ink-600">Save filter</button>
      </div>
    </div>
  </div>

  <script>
    const ALLOWED_CITIES = [
      'Plano',
      'Frisco',
      'Denton',
      'Richardson',
      'Carrollton',
      'Lewisville',
      'Allen',
      'Flower Mound',
      'North Richland Hills',
      'N. Richland Hills',
      'Euless',
      'Bedford',
      'Grapevine',
      'Keller',
      'Southlake',
      'Coppell',
      'Hurst',
      'The Colony',
      'Little Elm',
      'Argyle',
      'Lantana',
      'Double Oak',
      'Bartonville',
      'Highland Village',
      'Roanoke',
      'Northlake',
      'Westlake',
      'Trophy Club',
      'Colleyville'
    ];
    const allowedSet = new Set(ALLOWED_CITIES.map(normCity));
    const ALL_DFW_CITIES = [
      'Dallas', 'Fort Worth', 'Arlington', 'Plano', 'Garland', 'Irving', 'Grand Prairie',
      'McKinney', 'Frisco', 'Denton', 'Richardson', 'Mesquite', 'Carrollton', 'Lewisville',
      'Allen', 'Flower Mound', 'North Richland Hills', 'N. Richland Hills', 'Euless', 'Bedford',
      'Grapevine', 'Keller', 'Southlake', 'Coppell', 'Hurst', 'The Colony', 'Little Elm',
      'Rowlett', 'Wylie', 'Rockwall', 'Mansfield', 'Burleson', 'Cedar Hill', 'DeSoto',
      'Lancaster', 'Duncanville', 'Midlothian', 'Waxahachie', 'Prosper', 'Celina', 'Melissa',
      'Anna', 'Princeton', 'Fate', 'Royse City', 'Forney', 'Sunnyvale', 'Sachse', 'Murphy',
      'Parker', 'Fairview', 'Addison', 'Farmers Branch', 'Highland Park', 'University Park',
      'Balch Springs', 'Seagoville', 'Hutchins', 'Wilmer', 'Red Oak', 'Glenn Heights', 'Ovilla',
      'Venus', 'Joshua', 'Cleburne', 'Crowley', 'Benbrook', 'White Settlement', 'River Oaks',
      'Westworth Village', 'Lake Worth', 'Sansom Park', 'Azle', 'Saginaw', 'Haslet',
      'Roanoke', 'Trophy Club', 'Westlake', 'Northlake', 'Colleyville', 'Argyle', 'Bartonville',
      'Double Oak', 'Highland Village', 'Lantana', 'Corinth', 'Lake Dallas', 'Hickory Creek',
      'Shady Shores', 'Oak Point', 'Aubrey', 'Providence Village', 'Cross Roads', 'Ponder',
      'Justin', 'Krum', 'Sanger', 'Pilot Point', 'Decatur', 'Weatherford', 'Aledo',
      'Hudson Oaks', 'Willow Park', 'Springtown', 'Kennedale', 'Forest Hill', 'Everman',
      'Richland Hills', 'Haltom City', 'Watauga', 'Northlake', 'Westlake', 'Southlake'
    ];
    const allDfwSet = new Set(ALL_DFW_CITIES.map(normCity));

    let map, markerLayer;
    let allDeals = [];
    let authRole = null;
    let showAll = false;
    let listMode = false;
    let searchQuery = '';
    const MY_CITIES_KEY = 'alvacom_my_cities_v1';
    let runId = 0;
    let byId = {};
    let lastProps = [];
    let markerById = {};

    function normCity(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }

    function loadMyCities() {
      try {
        const raw = localStorage.getItem(MY_CITIES_KEY);
        if (!raw) return null;
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr) || !arr.length) return null;
        return arr.map(String);
      } catch (e) { return null; }
    }
    function saveMyCities(cities) {
      if (!cities || !cities.length) localStorage.removeItem(MY_CITIES_KEY);
      else localStorage.setItem(MY_CITIES_KEY, JSON.stringify(cities));
    }
    function getActiveCitySet() {
      if (authRole !== 'admin') {
        const mine = loadMyCities();
        if (mine && mine.length) return new Set(mine.map(normCity));
        return allDfwSet;
      }
      return allowedSet;
    }
    function syncRoleChrome() {
      const btnFilter = document.getElementById('btnFilter');
      const btnMy = document.getElementById('btnMyCities');
      const badge = document.getElementById('badge');
      if (authRole === 'admin') {
        btnFilter.classList.remove('hidden');
        btnMy.classList.add('hidden');
        badge.textContent = showAll ? 'All cities' : 'Target suburbs';
        badge.className = showAll
          ? 'hidden sm:inline-flex text-[11px] font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800'
          : 'hidden sm:inline-flex text-[11px] font-semibold px-2.5 py-1 rounded-full bg-ink-100 text-ink-700';
      } else {
        btnFilter.classList.add('hidden');
        btnMy.classList.remove('hidden');
        showAll = false;
        const mine = loadMyCities();
        badge.textContent = (mine && mine.length) ? ('My cities · ' + mine.length) : 'All DFW cities';
        badge.className = 'hidden sm:inline-flex text-[11px] font-semibold px-2.5 py-1 rounded-full bg-ink-100 text-ink-700';
      }
    }
    function openFilterModal() {
      const wrap = document.getElementById('cityChips');
      const selected = new Set((loadMyCities() || ALL_DFW_CITIES).map(normCity));
      const uniq = [];
      const seen = new Set();
      ALL_DFW_CITIES.forEach(c => {
        const n = normCity(c);
        if (seen.has(n)) return;
        seen.add(n);
        uniq.push(c);
      });
      uniq.sort((a, b) => a.localeCompare(b));
      wrap.innerHTML = uniq.map(c => {
        const n = normCity(c);
        return '<label class="flex items-center gap-2 rounded-lg border border-slate-200 px-2.5 py-2 hover:bg-slate-50 cursor-pointer">' +
          '<input type="checkbox" data-city="' + esc(c) + '"' + (selected.has(n) ? ' checked' : '') + ' />' +
          '<span>' + esc(c) + '</span></label>';
      }).join('');
      document.getElementById('filterModal').classList.remove('hidden');
    }
    function closeFilterModal() {
      document.getElementById('filterModal').classList.add('hidden');
    }
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function parseDate(raw) {
      if (!raw) return null;
      const s = String(raw).trim();
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      if (m) {
        const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
        const d = new Date(y, Number(m[1]) - 1, Number(m[2]));
        return isNaN(d.getTime()) ? null : d;
      }
      const d2 = new Date(s);
      return isNaN(d2.getTime()) ? null : d2;
    }
    function money(v) {
      if (!v) return 'Call for price';
      const n = Number(String(v).replace(/[^0-9.]/g, ''));
      if (!n || isNaN(n)) return String(v);
      return '$' + n.toLocaleString('en-US');
    }
    function fullLine(p) {
      return [p.address, [p.city, p.state].filter(Boolean).join(', '), p.zip].filter(Boolean).join(', ');
    }
    function makeId(p) {
      return (p.emailId || (p.address + '|' + p.emailDate + '|' + p.price)).toLowerCase();
    }
    function setStatus(html) { document.getElementById('status').innerHTML = html; }

    function matchesSearch(p, q) {
      if (!q) return true;
      const city = String(p.city || '').toLowerCase();
      const zip = String(p.zip || '').toLowerCase();
      return city.includes(q) || zip.includes(q);
    }

    function availBadgeHtml(p, opts) {
      opts = opts || {};
      const yes = p.available !== false;
      const label = yes ? 'Available' : 'Unavailable';
      const color = yes ? 'text-emerald-700' : 'text-slate-500';
      if (authRole === 'admin' && opts.interactive) {
        return (
          '<label class="inline-flex items-center gap-2 text-xs font-medium ' + color + ' cursor-pointer select-none">' +
            '<input type="checkbox" class="js-avail rounded border-slate-300 text-ink-700 focus:ring-ink-600" data-id="' + esc(p.id) + '"' + (yes ? ' checked' : '') + ' />' +
            '<span>' + label + '</span>' +
          '</label>'
        );
      }
      return '<div class="text-xs font-medium ' + color + '">' + label + '</div>';
    }

    function showLogin(msg) {
      const overlay = document.getElementById('loginOverlay');
      overlay.classList.remove('hidden');
      const err = document.getElementById('loginError');
      if (msg) {
        err.textContent = msg;
        err.classList.remove('hidden');
      } else {
        err.classList.add('hidden');
        err.textContent = '';
      }
      document.getElementById('btnLogout').classList.add('hidden');
      setTimeout(() => document.getElementById('password').focus(), 50);
    }

    function hideLogin() {
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('loginError').classList.add('hidden');
      document.getElementById('btnLogout').classList.remove('hidden');
    }

    async function loadDeals() {
      setStatus('<span class="spin"></span>Loading listings…');
      try {
        const resp = await fetch('/api/deals', { credentials: 'same-origin' });
        if (resp.status === 401) {
          showLogin();
          setStatus('Sign in to view listings.');
          return false;
        }
        if (!resp.ok) {
          const t = await resp.text();
          setStatus('<span class="text-red-600">Could not load listings (' + resp.status + ').</span>');
          console.error(t);
          return false;
        }
        const data = await resp.json();
        authRole = data.role || null;
        allDeals = Array.isArray(data.deals) ? data.deals : [];
        hideLogin();
        syncRoleChrome();
        processRows();
        return true;
      } catch (err) {
        setStatus('<span class="text-red-600">Could not load listings: ' + esc(err && err.message) + '</span>');
        return false;
      }
    }

    async function setAvailability(id, available) {
      const resp = await fetch('/api/availability', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, available })
      });
      if (resp.status === 403) throw new Error('Admin only');
      if (!resp.ok) throw new Error('Save failed (' + resp.status + ')');
      return resp.json();
    }

    function applyLocalAvailable(id, available) {
      const deal = allDeals.find(d => (d.id || makeId(d)) === id);
      if (deal) deal.available = available;
      if (byId[id]) byId[id].available = available;
      const lp = lastProps.find(p => p.id === id);
      if (lp) lp.available = available;
    }

    async function onAvailToggle(id, checked, checkboxEl) {
      const prev = !checked;
      try {
        await setAvailability(id, checked);
        applyLocalAvailable(id, checked);
        refreshVisible();
        if (location.hash === '#p=' + encodeURIComponent(id) || (byId[id] && !document.getElementById('sheet').classList.contains('hidden'))) {
          const openId = decodeURIComponent((location.hash || '').slice(3));
          if (openId === id || (!location.hash.startsWith('#p=') && byId[id])) {
            // re-open sheet if currently viewing this deal
            if (!document.getElementById('sheet').classList.contains('hidden')) openSheet(id);
          }
        }
      } catch (err) {
        if (checkboxEl) checkboxEl.checked = prev;
        alert(err && err.message ? err.message : 'Could not update availability');
      }
    }

    function bindAvailCheckboxes(root) {
      (root || document).querySelectorAll('.js-avail').forEach(cb => {
        cb.addEventListener('change', () => {
          onAvailToggle(cb.getAttribute('data-id'), cb.checked, cb);
        });
      });
    }

    function refreshVisible() {
      renderList(lastProps);
      rebuildMarkersFromCache(lastProps);
      setStatus(lastProps.length + ' listings' + (searchQuery ? ' (search)' : '') + (authRole !== 'admin' && loadMyCities() ? ' · my cities' : ''));
    }

    function init() {
      map = L.map('map').setView([32.7767, -96.7970], 9);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);
      markerLayer = L.layerGroup().addTo(map);

      document.getElementById('btnFilter').onclick = toggleFilter;
      document.getElementById('btnMyCities').onclick = openFilterModal;
      document.getElementById('btnFilterClose').onclick = closeFilterModal;
      document.getElementById('filterModal').addEventListener('click', (e) => {
        if (e.target.id === 'filterModal') closeFilterModal();
      });
      document.getElementById('btnFilterReset').onclick = () => {
        saveMyCities(null);
        closeFilterModal();
        syncRoleChrome();
        processRows({ reuseGeo: true });
      };
      document.getElementById('btnFilterSave').onclick = () => {
        const picked = [];
        document.querySelectorAll('#cityChips input[type=checkbox]:checked').forEach(cb => {
          picked.push(cb.getAttribute('data-city'));
        });
        if (!picked.length) {
          alert('Pick at least one city, or choose “All DFW cities”.');
          return;
        }
        saveMyCities(picked);
        closeFilterModal();
        syncRoleChrome();
        processRows({ reuseGeo: true });
      };
      document.getElementById('btnView').onclick = toggleView;
      document.getElementById('btnClose').onclick = closeSheet;
      document.getElementById('backdrop').onclick = closeSheet;
      document.getElementById('btnPrint').onclick = () => window.print();
      document.getElementById('btnLogout').onclick = async () => {
        try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch (_) {}
        authRole = null;
        allDeals = [];
        byId = {};
        lastProps = [];
        markerById = {};
        markerLayer.clearLayers();
        renderList([]);
        showLogin();
        setStatus('Signed out.');
      };
      window.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          if (!document.getElementById('filterModal').classList.contains('hidden')) closeFilterModal();
          else closeSheet();
        }
      });

      let searchTimer = null;
      document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          searchQuery = String(e.target.value || '').toLowerCase().trim();
          processRows({ reuseGeo: true });
        }, 180);
      });

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const pw = document.getElementById('password').value;
        const err = document.getElementById('loginError');
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        err.classList.add('hidden');
        try {
          const resp = await fetch('/api/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw })
          });
          if (!resp.ok) {
            err.textContent = 'Incorrect password.';
            err.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'Sign in';
            return;
          }
          document.getElementById('password').value = '';
          btn.disabled = false;
          btn.textContent = 'Sign in';
          await loadDeals();
        } catch (ex) {
          err.textContent = 'Sign-in failed. Try again.';
          err.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      });

      loadDeals();
    }

    function toggleFilter() {
      showAll = !showAll;
      const badge = document.getElementById('badge');
      const btn = document.getElementById('btnFilter');
      if (showAll) {
        btn.textContent = 'Show DFW focus';
        badge.textContent = 'All cities';
        badge.className = 'hidden sm:inline-flex text-[11px] font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800';
      } else {
        btn.textContent = 'Show all cities';
        badge.textContent = 'Target suburbs';
        badge.className = 'hidden sm:inline-flex text-[11px] font-semibold px-2.5 py-1 rounded-full bg-ink-100 text-ink-700';
      }
      processRows({ reuseGeo: true });
    }

    function toggleView() {
      listMode = !listMode;
      const btn = document.getElementById('btnView');
      const list = document.getElementById('list');
      const mapEl = document.getElementById('map');
      if (listMode) {
        btn.textContent = 'Map view';
        mapEl.classList.add('hidden');
        list.classList.remove('hidden');
      } else {
        btn.textContent = 'List view';
        list.classList.add('hidden');
        mapEl.classList.remove('hidden');
        setTimeout(() => map.invalidateSize(), 40);
      }
    }

    async function processRows(opts) {
      opts = opts || {};
      const my = ++runId;
      if (!allDeals.length) {
        markerLayer.clearLayers();
        lastProps = [];
        renderList([]);
        setStatus('0 listings for this filter.');
        return;
      }

      const geoCache = {};
      if (opts.reuseGeo) {
        lastProps.forEach(p => {
          if (p.lat != null && p.lon != null) geoCache[p.id] = { lat: p.lat, lon: p.lon };
        });
      }

      const props = [];
      const citySet = getActiveCitySet();
      for (const d of allDeals) {
        const address = d.address || '';
        if (!address) continue;
        if (authRole !== 'admin' && d.available === false) continue;
        const city = d.city || '';
        if (!(authRole === 'admin' && showAll)) {
          if (!citySet.has(normCity(city))) continue;
        }
        const p = {
          address,
          city,
          state: d.state || 'TX',
          zip: d.zip || '',
          price: d.price || '',
          sender: d.sender || '',
          emailDate: d.emailDate || '',
          beds: d.beds || '',
          baths: d.baths || '',
          garage: d.garage || '',
          sqft: d.sqft || '',
          year: d.year || '',
          comments: d.comments || '',
          subject: d.subject || '',
          emailId: d.emailId || '',
          available: d.available !== false,
          id: d.id || ''
        };
        if (!p.id) p.id = makeId(p);
        if (!matchesSearch(p, searchQuery)) continue;
        if (geoCache[p.id]) {
          p.lat = geoCache[p.id].lat;
          p.lon = geoCache[p.id].lon;
        }
        props.push(p);
      }

      if (my !== runId) return;
      byId = {};
      props.forEach(p => { byId[p.id] = p; });
      lastProps = props;

      if (!props.length) {
        markerLayer.clearLayers();
        renderList([]);
        setStatus('0 listings for this filter.');
        return;
      }

      setStatus('<span class="spin"></span>Mapping ' + props.length + ' listings…');
      await plotMarkers(props, my);
      if (my !== runId) return;
      renderList(props);
      setStatus(props.length + ' listings' + (searchQuery ? ' (search)' : '') + (authRole !== 'admin' && loadMyCities() ? ' · my cities' : ''));

      if (location.hash.startsWith('#p=')) {
        const id = decodeURIComponent(location.hash.slice(3));
        if (byId[id]) openSheet(id);
      }
    }

    async function geocode(p) {
      let q = p.address;
      if (p.city) q += ', ' + p.city;
      if (p.zip) q += ' ' + p.zip;
      q += ', TX, USA';
      const cacheKey = 'geo_v3_' + q;
      try {
        const cached = localStorage.getItem(cacheKey);
        if (cached) return { coords: JSON.parse(cached), cached: true };
      } catch (e) {}
      try {
        const params = new URLSearchParams({ format: 'json', q, countrycodes: 'us', limit: '1', email: 'map@alvacomhomes.local' });
        const resp = await fetch('https://nominatim.openstreetmap.org/search?' + params.toString(), { headers: { Accept: 'application/json' } });
        const data = await resp.json();
        if (data && data.length) {
          const coords = { lat: data[0].lat, lon: data[0].lon };
          try { localStorage.setItem(cacheKey, JSON.stringify(coords)); } catch (e) {}
          return { coords, cached: false };
        }
      } catch (e) {}
      return null;
    }

    function buildPopup(p) {
      const facts = [p.beds && (p.beds + ' bd'), p.baths && (p.baths + ' ba'), p.sqft && (p.sqft + ' sf')].filter(Boolean).join(' · ');
      const wholesalerLine = p.sender
        ? '<div class="text-xs text-slate-500 mb-1">Wholesaler: ' + esc(p.sender) + '</div>'
        : '';
      const unavailNote = p.available === false
        ? '<div class="text-[10px] font-semibold uppercase tracking-wide text-slate-500 mb-1">Unavailable</div>'
        : '';
      const wrap = document.createElement('div');
      wrap.className = 'text-sm leading-snug';
      wrap.innerHTML =
        unavailNote +
        '<div class="font-semibold text-slate-800 mb-1">' + esc(fullLine(p)) + '</div>' +
        '<div class="font-bold text-ink-600 mb-1">' + esc(money(p.price)) + '</div>' +
        (facts ? '<div class="text-xs text-slate-600 mb-1">' + esc(facts) + '</div>' : '') +
        '<div class="mb-2">' + availBadgeHtml(p, { interactive: true }) + '</div>' +
        wholesalerLine +
        '<button type="button" class="text-xs font-semibold px-2.5 py-1.5 rounded-md bg-ink-700 text-white">Open brief</button>';
      wrap.querySelector('button').addEventListener('click', () => openSheet(p.id));
      bindAvailCheckboxes(wrap);
      return wrap;
    }

    function addMarkerFor(p) {
      if (p.lat == null || p.lon == null) return null;
      const icon = L.divIcon({
        className: '',
        html: '<div class="' + (p.available === false ? 'marker-unavail' : '') + '" style="width:25px;height:41px;margin-left:-12px;margin-top:-41px;background:url(https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png) no-repeat center/contain;"></div>',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
      });
      const m = L.marker([p.lat, p.lon], { icon, opacity: p.available === false ? 0.7 : 1 });
      m.bindPopup(() => buildPopup(p));
      m.addTo(markerLayer);
      markerById[p.id] = m;
      return m;
    }

    async function plotMarkers(props, my) {
      markerLayer.clearLayers();
      markerById = {};
      const bounds = [];
      for (let i = 0; i < props.length; i++) {
        if (my !== runId) return;
        setStatus('<span class="spin"></span>Mapping ' + (i + 1) + ' / ' + props.length + '…');
        const p = props[i];
        if (p.lat == null || p.lon == null) {
          const geo = await geocode(p);
          if (!geo) { await sleep(150); continue; }
          await sleep(geo.cached ? 30 : 900);
          p.lat = geo.coords.lat;
          p.lon = geo.coords.lon;
        }
        addMarkerFor(p);
        bounds.push([p.lat, p.lon]);
      }
      if (my !== runId) return;
      if (bounds.length) map.fitBounds(bounds, { padding: [48, 48] });
    }

    function rebuildMarkersFromCache(props) {
      markerLayer.clearLayers();
      markerById = {};
      const bounds = [];
      props.forEach(p => {
        if (p.lat == null || p.lon == null) return;
        addMarkerFor(p);
        bounds.push([p.lat, p.lon]);
      });
    }

    function pill(label, value) {
      if (!value) return '';
      return '<div class="rounded-xl border border-slate-200 bg-ink-50 px-3 py-2"><div class="text-[10px] uppercase tracking-wider text-slate-400">' +
        label + '</div><div class="font-semibold text-ink-700">' + esc(value) + '</div></div>';
    }

    function openSheet(id) {
      const p = byId[id];
      if (!p) return;
      history.replaceState(null, '', '#p=' + encodeURIComponent(id));
      const dateObj = parseDate(p.emailDate);
      const dateStr = dateObj ? dateObj.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : (p.emailDate || '—');
      const blurb = p.comments || p.subject || 'Off-market opportunity sourced from wholesaler inventory.';
      const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(fullLine(p));
      const street = (p.lat && p.lon) ? ('https://www.google.com/maps?layer=c&cbll=' + p.lat + ',' + p.lon + '&cbp=12,0,0,0,0') : '';
      const availColor = p.available !== false ? 'text-emerald-300' : 'text-slate-300';

      const wholesalerSection = p.sender
        ? ('<section class="mb-5">' +
            '<div class="rounded-xl border border-slate-200 px-4 py-3 text-sm">' +
              '<span class="text-slate-400 text-xs uppercase tracking-wider">Wholesaler</span>' +
              '<div class="font-medium text-ink-700 mt-0.5">' + esc(p.sender) + '</div>' +
            '</div>' +
          '</section>')
        : '';

      document.getElementById('sheetBody').innerHTML =
        '<div class="border border-slate-200 rounded-2xl overflow-hidden mb-5">' +
          '<div class="bg-ink-700 text-white px-5 py-4">' +
            '<div class="font-display text-2xl font-semibold leading-tight">' + esc(p.address) + '</div>' +
            '<div class="text-sm text-white/80 mt-1">' + esc([p.city, p.state, p.zip].filter(Boolean).join(', ')) + '</div>' +
            '<div class="mt-3 text-2xl font-bold text-gold-400">' + esc(money(p.price)) + '</div>' +
            '<div class="mt-2 no-print">' +
              (authRole === 'admin'
                ? ('<label class="inline-flex items-center gap-2 text-xs font-medium ' + availColor + ' cursor-pointer select-none">' +
                    '<input type="checkbox" class="js-avail rounded border-white/40 text-ink-700 focus:ring-gold-400" data-id="' + esc(p.id) + '"' + (p.available !== false ? ' checked' : '') + ' />' +
                    '<span>' + (p.available !== false ? 'Available' : 'Unavailable') + '</span>' +
                  '</label>')
                : ('<div class="text-xs font-medium ' + availColor + '">' + (p.available !== false ? 'Available' : 'Unavailable') + '</div>')) +
            '</div>' +
          '</div>' +
          '<div class="grid grid-cols-2 sm:grid-cols-3 gap-2 p-4">' +
            pill('Beds', p.beds) + pill('Baths', p.baths) + pill('Sq Ft', p.sqft) +
            pill('Year', p.year) + pill('Garage', p.garage) + pill('Listed', dateStr) +
          '</div>' +
        '</div>' +
        '<section class="mb-5">' +
          '<h3 class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-400 mb-2">From the deal email</h3>' +
          '<p class="text-sm leading-relaxed text-slate-700 whitespace-pre-wrap">' + esc(blurb) + '</p>' +
          (p.subject ? '<p class="mt-2 text-xs text-slate-500"><span class="font-semibold text-slate-600">Subject:</span> ' + esc(p.subject) + '</p>' : '') +
        '</section>' +
        wholesalerSection +
        '<div class="no-print flex flex-col sm:flex-row gap-2 mb-6">' +
          '<a href="' + maps + '" target="_blank" rel="noopener" class="flex-1 text-center text-xs font-semibold px-4 py-3 rounded-xl bg-ink-700 text-white hover:bg-ink-600">Google Maps</a>' +
          (street ? '<a href="' + street + '" target="_blank" rel="noopener" class="flex-1 text-center text-xs font-semibold px-4 py-3 rounded-xl border border-slate-200 hover:bg-slate-50">Street View</a>' : '') +
          '<button type="button" id="btnCopy" class="flex-1 text-xs font-semibold px-4 py-3 rounded-xl border border-gold-500 text-gold-600 hover:bg-amber-50">Copy link</button>' +
        '</div>' +
        '<footer class="border-t border-slate-100 pt-4 text-center">' +
          '<div class="font-display text-xl text-ink-700">Alvacom Homes</div>' +
          '<div class="text-[10px] uppercase tracking-[0.2em] text-slate-400 mt-1">Off-Market · DFW</div>' +
          '<p class="text-[11px] text-slate-400 mt-3 leading-relaxed">Informational overview compiled from wholesaler emails. Verify all details independently. Not a public MLS listing.</p>' +
        '</footer>';

      const copyBtn = document.getElementById('btnCopy');
      if (copyBtn) copyBtn.onclick = () => navigator.clipboard.writeText(location.href);
      bindAvailCheckboxes(document.getElementById('sheetBody'));
      document.getElementById('sheet').classList.remove('hidden');
      document.getElementById('backdrop').classList.remove('hidden');
    }

    function closeSheet() {
      document.getElementById('sheet').classList.add('hidden');
      document.getElementById('backdrop').classList.add('hidden');
      if (location.hash.startsWith('#p=')) history.replaceState(null, '', location.pathname + location.search);
    }

    function renderList(props) {
      const grid = document.getElementById('grid');
      if (!props.length) {
        grid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-16">No listings match this filter.</div>';
        return;
      }
      grid.innerHTML = props.map(p => {
        const dateObj = parseDate(p.emailDate);
        const dateStr = dateObj ? dateObj.toLocaleDateString() : (p.emailDate || '');
        const facts = [p.beds && (p.beds + ' bd'), p.baths && (p.baths + ' ba'), p.sqft && (p.sqft + ' sf')].filter(Boolean).join(' · ');
        const unavail = p.available === false;
        return (
          '<article class="rounded-2xl border shadow-sm hover:shadow-md transition p-5 flex flex-col justify-between ' +
            (unavail ? 'card-unavail border-slate-300' : 'bg-white border-slate-200') + '">' +
            '<div>' +
              '<div class="flex items-start justify-between gap-3 mb-2">' +
                '<h3 class="font-display text-xl font-semibold text-ink-700 leading-snug">' + esc(p.address) + '</h3>' +
                '<span class="shrink-0 text-sm font-bold text-gold-600 bg-amber-50 px-2.5 py-1 rounded-lg">' + esc(money(p.price)) + '</span>' +
              '</div>' +
              (unavail ? '<span class="inline-block mb-2 text-[10px] font-semibold uppercase tracking-wide px-2 py-0.5 rounded bg-slate-200 text-slate-600">Unavailable</span>' : '') +
              '<p class="text-sm text-slate-500 mb-3">' + esc([p.city, p.state, p.zip].filter(Boolean).join(', ')) + '</p>' +
              (facts ? '<p class="text-xs font-medium text-ink-600 mb-1">' + esc(facts) + '</p>' : '') +
              '<div class="mb-3">' + availBadgeHtml(p, { interactive: true }) + '</div>' +
              '<p class="text-xs text-slate-500 line-clamp-3 mb-4">' + esc((p.comments || p.subject || '').slice(0, 180)) + '</p>' +
            '</div>' +
            '<div class="flex items-center justify-between gap-2 pt-3 border-t border-slate-100">' +
              '<span class="text-[11px] text-slate-400">' + esc(dateStr) + '</span>' +
              '<button type="button" data-id="' + esc(p.id) + '" class="js-open text-xs font-semibold px-3 py-2 rounded-lg bg-ink-700 text-white hover:bg-ink-600">One-pager</button>' +
            '</div>' +
          '</article>'
        );
      }).join('');
      grid.querySelectorAll('.js-open').forEach(btn => {
        btn.addEventListener('click', () => openSheet(btn.getAttribute('data-id')));
      });
      bindAvailCheckboxes(grid);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
