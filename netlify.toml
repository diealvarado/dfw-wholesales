[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/registrations/approve"
  to = "/.netlify/functions/registrations-approve"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "https://alvacomhomes.netlify.app/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "https://alvacomhomes.netlify.app/favicon.svg"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "https://alvacomhomes.netlify.app/favicon.png"
  to = "/favicon.png"
  status = 200

[[redirects]]
  from = "https://alvacomhomes.netlify.app/*"
  to = "/site/:splat"
  status = 200
